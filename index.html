<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Постеры на главной</title>
<style>
  :root {
    --ink: #f4f7ff;
    --muted: #d5def5;
    --gold: #ffd56a;
    --gold-2: #ffe7a3;
    --navy: #10182e;
    --navy-2: #1b2746;
    --line: #35508a;
    --mint: #7ddeb8;
    --sky: #8ecbff;
    --coral: #f0b2a6;
    --scene-dim: rgba(2, 4, 12, 0.38);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #03060d;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    user-select: none;
    -webkit-user-select: none;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  button:focus { outline: none; }

  #letterbox {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03060d;
  }

  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 960px;
    height: 540px;
    margin: -270px 0 0 -480px;
    transform-origin: center center;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 18% 12%, rgba(98, 78, 186, 0.42), transparent 46%),
      radial-gradient(ellipse at 92% 88%, rgba(28, 118, 158, 0.34), transparent 44%),
      radial-gradient(ellipse at 70% 0%, rgba(232, 176, 92, 0.14), transparent 36%),
      #070b16;
  }

  #sky {
    position: absolute;
    inset: 0;
    width: 960px;
    height: 540px;
    z-index: 0;
  }

  .scene-dim {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: none;
    background: var(--scene-dim);
    pointer-events: none;
  }

  #stage[data-screen="lobby"] .scene-dim,
  #stage[data-screen="question"] .scene-dim,
  #stage[data-screen="feedback"] .scene-dim,
  #stage[data-screen="results"] .scene-dim { display: block; }

  #stage[data-screen="question"] .deco,
  #stage[data-screen="feedback"] .deco,
  #stage[data-screen="results"] .deco { display: none; }

  #stage.is-paused .card,
  #stage.is-paused #lobby { visibility: hidden; }

  .deco {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .planet {
    position: absolute;
    animation: floaty 6.5s ease-in-out infinite alternate;
  }

  .planet.saturn { width: 210px; right: -48px; top: -36px; }
  .planet.earth { width: 168px; left: -52px; bottom: -46px; animation-delay: -2.2s; }
  .planet.mars { width: 86px; left: 6px; top: -8px; animation-delay: -3.4s; }

  @keyframes floaty {
    from { transform: translate3d(0, 0, 0); }
    to { transform: translate3d(0, -12px, 0); }
  }

  .card {
    position: absolute;
    z-index: 2;
    left: 48px;
    top: 27px;
    width: 864px;
    height: 486px;
    padding: 14px 22px 16px;
    border-radius: 28px;
    background: rgba(12, 18, 40, 0.94);
    border: 2px solid rgba(255, 214, 120, 0.38);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sound-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 4;
    width: 48px;
    height: 48px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid rgba(255, 213, 106, 0.75);
    background: #1a2444;
    color: var(--gold);
    display: grid;
    place-items: center;
  }

  .sound-btn .slash { display: none; }
  .sound-btn.is-muted .wave { display: none; }
  .sound-btn.is-muted .slash { display: block; }

  .hud {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 48px;
    padding-right: 64px;
    flex: none;
  }

  .card[data-mode="question"] .hud,
  .card[data-mode="feedback"] .hud { display: flex; }

  .hud-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  #hud-label, #hud-score {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.2;
    white-space: nowrap;
  }

  #hud-label { color: var(--gold); }
  #hud-score { color: var(--sky); }

  .pips { display: flex; gap: 7px; }
  .pip {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
  }
  .pip.is-done { background: var(--mint); }
  .pip.is-now {
    background: var(--gold);
    transform: scale(1.12);
  }

  .screen { display: none; min-height: 0; }
  .screen.active {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    animation: fade 0.28s ease;
  }

  @keyframes fade {
    from { opacity: 0; transform: translate3d(0, 8px, 0); }
    to { opacity: 1; transform: none; }
  }

  .hero {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .rocket-col {
    position: relative;
    width: 228px;
    height: 270px;
    flex: none;
    display: grid;
    place-items: center;
  }

  .orbit {
    position: absolute;
    width: 230px;
    height: 230px;
    animation: spin 28s linear infinite;
  }

  .rocket {
    position: relative;
    z-index: 1;
    width: 132px;
    height: auto;
    animation: floaty 3.8s ease-in-out infinite alternate;
  }

  .flame { animation: flick 0.32s ease-in-out infinite alternate; }
  @keyframes flick {
    from { opacity: 0.65; }
    to { opacity: 1; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hero-copy { min-width: 0; flex: 1; }

  .eyebrow {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 800;
    color: var(--sky);
  }

  h1 {
    margin: 0 0 10px;
    font-size: 48px;
    line-height: 1.2;
    font-weight: 800;
    color: #fff8ea;
  }

  .gold { color: var(--gold); }

  .lead {
    margin: 0 0 18px;
    font-size: 24px;
    line-height: 1.3;
    font-weight: 700;
    color: var(--muted);
    max-width: 540px;
  }

  .hint {
    margin: 14px 0 0;
    font-size: 20px;
    line-height: 1.35;
    font-weight: 700;
    color: #c9d6f4;
    max-width: 540px;
  }

  .go {
    appearance: none;
    width: 100%;
    max-width: 420px;
    height: 68px;
    border-radius: 18px;
    border: 3px solid var(--gold-2);
    background: var(--gold);
    color: #1c1730;
    font-size: 28px;
    font-weight: 800;
  }

  .go.is-focused,
  .choice.is-focused {
    transform: scale(1.035);
    box-shadow: 0 0 0 4px #ffffff, 0 0 0 8px #7ddeb8;
    z-index: 1;
  }

  .card[data-mode="question"],
  .card[data-mode="feedback"],
  .card[data-mode="results"] {
    left: 0;
    top: 0;
    width: 960px;
    height: 540px;
    padding: 24px 56px 22px;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }

  .q-text {
    flex: none;
    margin: 14px 0 18px;
    font-size: 34px;
    line-height: 1.2;
    font-weight: 800;
    color: #fff8ea;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
  }

  .answers {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    gap: 32px;
  }

  #answers {
    flex: none;
    height: 292px;
    margin: 12px 0 auto;
  }

  .answer {
    position: relative;
    flex: 0 0 176px;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
    text-align: center;
    border-radius: 22px;
    border: 0;
    outline: none;
    box-shadow: none;
    background: rgba(255, 255, 255, 0.07);
    color: var(--ink);
    font-size: 26px;
    font-weight: 800;
    line-height: 1.15;
  }

  .answer .art {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 16px;
  }

  .answer .art-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .answer .num {
    font-size: 64px;
    line-height: 1;
    font-weight: 800;
    color: rgba(255, 255, 255, 0.4);
  }

  .answer .caption {
    flex: none;
    height: 84px;
    padding: 8px 12px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .answer:focus,
  .answer:focus-visible {
    outline: none;
    box-shadow: none;
  }

  .answer .label {
    display: block;
    min-width: 0;
    font-size: 26px;
    line-height: 1.15;
    font-weight: 800;
  }

  .card[data-mode="question"] .answer.is-focused,
  .card[data-mode="feedback"] .answer.is-focused {
    transform: none;
    border: 0;
    outline: none;
    background: rgba(255, 255, 255, 0.12);
    box-shadow: none;
    z-index: 1;
  }

  .answer.is-right {
    background: rgba(125, 222, 184, 0.14);
  }

  .answer.is-right .caption { background: rgba(20, 54, 46, 0.85); }

  .answer.is-picked .caption { background: rgba(58, 44, 56, 0.85); }

  .fb-q {
    flex: none;
    margin: 6px 0 4px;
    font-size: 24px;
    line-height: 1.25;
    font-weight: 800;
    color: #dbe6ff;
  }

  .fb-title {
    flex: none;
    margin: 0;
    font-size: 32px;
    line-height: 1.15;
    font-weight: 800;
  }

  .fb-title.is-good { color: #c8ffe8; }
  .fb-title.is-soft { color: #ffe1c7; }

  .fb-sub {
    flex: none;
    margin: 4px 0 10px;
    font-size: 22px;
    line-height: 1.3;
    font-weight: 700;
    color: var(--muted);
  }

  .pills {
    flex: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .pills.single { grid-template-columns: 1fr; }

  .pill {
    border-radius: 16px;
    padding: 8px 14px 10px;
    border: 3px solid transparent;
    min-width: 0;
  }

  .pill[hidden] { display: none !important; }

  .pill-label {
    display: block;
    font-size: 18px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 2px;
  }

  .pill-text {
    display: block;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.2;
  }

  #fb-chosen-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pill-good {
    background: #14362e;
    border-color: var(--mint);
    color: #e9fff6;
  }

  .pill-soft {
    background: #3a2c38;
    border-color: var(--coral);
    color: #ffe8e2;
  }

  .fb-foot {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 10px;
  }

  .fact-wrap {
    margin-top: 10px;
    background: #18233f;
    border-radius: 16px;
    padding: 8px 14px 10px;
    border: 2px solid #31456f;
    min-height: 0;
  }

  .card[data-mode="feedback"] .fact-wrap {
    flex: 1;
    margin: 0;
    padding: 0;
    background: transparent;
    border: 0;
  }

  .card[data-mode="feedback"] .fb-title {
    margin: 0;
    font-size: 26px;
  }

  .card[data-mode="feedback"] .fb-sub {
    margin: 2px 0 8px;
    font-size: 20px;
  }

  .card[data-mode="feedback"] #btn-next {
    width: 250px;
    margin: 0;
    flex: none;
  }

  .fact-label {
    font-size: 18px;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 2px;
  }

  .fact {
    margin: 0;
    font-size: 22px;
    line-height: 1.32;
    font-weight: 700;
    color: var(--ink);
  }

  #btn-next {
    margin-top: auto;
    margin-bottom: 4px;
    flex: none;
    max-width: none;
    width: calc(100% - 20px);
    align-self: center;
  }

  #screen-results.active {
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .crew {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    color: var(--sky);
  }

  #res-score {
    margin: 2px 0 0;
    font-size: 40px;
    line-height: 1.1;
    font-weight: 800;
    color: var(--gold);
  }

  .awards {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 6px 0;
  }

  .award { width: 68px; height: 68px; }
  .award path {
    fill: rgba(255, 244, 214, 0.14);
    stroke: rgba(255, 213, 106, 0.75);
    stroke-width: 2;
    stroke-linejoin: round;
  }
  .award.is-on path { fill: var(--gold); stroke: #fff3cc; }
  .award.is-on { animation: starIn 0.45s ease both; }

  @keyframes starIn {
    from { opacity: 0; transform: scale(0.4); }
    to { opacity: 1; transform: scale(1); }
  }

  #res-title {
    margin: 4px 0 6px;
    font-size: 36px;
    line-height: 1.15;
    font-weight: 800;
  }

  #res-text {
    margin: 0 0 14px;
    max-width: 680px;
    font-size: 22px;
    line-height: 1.35;
    font-weight: 700;
    color: var(--muted);
  }

  .res-board {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 10px;
    max-width: 780px;
    margin: 0 0 12px;
  }

  .res-player {
    padding: 6px 14px;
    border-radius: 999px;
    background: #1b2746;
    border: 2px solid var(--line);
    font-size: 22px;
    font-weight: 800;
    line-height: 1.2;
    color: var(--ink);
  }

  .res-player b { color: var(--gold); }
  .res-player.is-top { border-color: var(--gold); }

  .crew-row {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    min-height: 44px;
  }

  .crew-chips {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 44px;
    overflow: hidden;
  }

  .crew-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 44px;
    padding: 0 14px;
    border-radius: 999px;
    background: #1b2746;
    border: 2px solid var(--line);
    font-size: 20px;
    font-weight: 800;
    color: #aebbd9;
    white-space: nowrap;
  }

  .crew-chip.is-done {
    background: #14362e;
    border-color: var(--mint);
    color: #e9fff6;
  }

  .q-timer {
    flex: none;
    min-width: 76px;
    height: 44px;
    padding: 0 14px;
    border-radius: 999px;
    background: #1b2746;
    border: 2px solid var(--sky);
    display: grid;
    place-items: center;
    font-size: 22px;
    font-weight: 800;
    color: var(--sky);
  }

  .answer.is-static { cursor: default; }

  #home {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: none;
    overflow: hidden;
    transition: transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
    background: #000;
    color: #fff;
    font-weight: 500;
    --chip-h: 40px;
    --chip-px: 16px;
    --chip-fs: 15px;
    --chip-lh: 20px;
    --chip-fw: 500;
    --chip-r: 12px;
  }

  #stage[data-screen="home"] #home { display: block; }
  #stage[data-screen="home"] #sky,
  #stage[data-screen="home"] .card,
  #stage[data-screen="home"] .deco { display: none; }

  .home-scroll {
    --glide: 420ms cubic-bezier(0.22, 1, 0.36, 1);
    position: absolute;
    left: 0;
    top: 0;
    width: 960px;
    height: 1008px;
    transition: transform var(--glide);
    will-change: transform;
  }

  .home-slide {
    position: absolute;
    top: 0;
    width: 852px;
    height: 368px;
    overflow: hidden;
    background: #000;
  }

  .home-slide-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .home-slide::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.32);
  }

  .home-slide.is-prev { display: none; }
  .home-slide.is-next { left: 914px; }

  .home-poster {
    appearance: none;
    position: absolute;
    left: 54px;
    top: 0;
    width: 852px;
    height: 368px;
    padding: 0;
    border: 0;
    border-radius: 0;
    overflow: hidden;
    text-align: left;
    color: #fff;
    background: #000;
  }

  .home-poster,
  .home-poster:focus,
  .home-poster:focus-visible,
  .home-poster.is-focused {
    outline: none;
    box-shadow: none;
    border: 0;
  }


  .home-poster-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  .home-poster-shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #000 0%, rgba(0, 0, 0, 0.92) 16%, rgba(0, 0, 0, 0.55) 38%, rgba(0, 0, 0, 0) 62%);
    pointer-events: none;
  }

  .home-poster::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #000 0%, rgba(0, 0, 0, 0) 15%);
    pointer-events: none;
  }

  .home-poster-fade,
  .home-slide::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 72px;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.6) 55%, #000 100%);
    pointer-events: none;
  }

  .home-slide::before { z-index: 1; }

  .home-shade-top {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    z-index: 2;
    width: 100%;
    height: 107px;
    background: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.7) 40%, rgba(0, 0, 0, 0) 100%);
    pointer-events: none;
  }

  .home-shade-bottom {
    position: absolute;
    left: 0;
    top: 368px;
    z-index: 2;
    width: 956px;
    height: 107px;
    background: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.7) 32%, rgba(0, 0, 0, 0) 100%);
    pointer-events: none;
  }

  .home-header {
    position: absolute;
    left: 2px;
    top: 0;
    z-index: 3;
    width: 956px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 86px;
    background: none;
    pointer-events: none;
  }

  .home-header-side {
    flex: 1 0 0;
    min-width: 1px;
    height: 40px;
    display: flex;
    align-items: center;
  }

  .home-header-side.is-right { justify-content: flex-end; }

  .home-logo {
    position: relative;
    width: 62.63px;
    height: 36px;
  }

  .home-logo img {
    position: absolute;
    left: 0;
    top: 1.48px;
    width: 62.63px;
    height: 33.04px;
  }

  .home-search,
  .home-profile {
    display: flex;
    align-items: center;
    height: 40px;
    border-radius: 12px;
    color: #dbd9e0;
    font-size: 15px;
    line-height: 20px;
    font-weight: 500;
    white-space: nowrap;
  }

  .home-search {
    gap: 6px;
    padding: 0 16px;
  }

  .home-profile {
    gap: 8px;
    padding: 4px 8px 4px 4px;
  }

  .home-profile-icon {
    display: flex;
    padding: 8px;
    border-radius: 8px;
    background: #1f1f1f;
  }

  /* Left navigation rail (ИВИ TV style) */
  #home .home-logo { visibility: hidden; }

  .side-rail {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 5;
    width: 68px;
    height: 100%;
    background: none;
    pointer-events: none;
  }

  .side-rail::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 86px;
    height: 100%;
    background: linear-gradient(90deg, #000 0%, rgba(0, 0, 0, 0.9) 48%, rgba(0, 0, 0, 0) 100%);
  }

  .rail-logo {
    position: absolute;
    top: 24px;
    left: calc(50% - 2px);
    transform: translateX(-50%);
    width: 32px;
    height: 32px;
  }

  .rail-logo img { display: block; width: 100%; height: 100%; }

  .rail-items {
    position: absolute;
    top: 50%;
    left: calc(50% - 2px);
    transform: translate(-50%, -50%);

  function tone(freq, when, dur, type, vol) {
    const ctx = ensureAudio();

    const osc = ctx.createOscillator();

    osc.frequency.setValueAtTime(freq, when);
    gain.gain.setValueAtTime(vol, when);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(when);
    osc.stop(when + dur + 0.03);
  }

  function offsetTopIn(el, container) {
    let y = 0;
    let node = el;
    while (node && node !== container) { y += node.offsetTop; node = node.offsetParent; }

  function homeMaxY() {

    const slot = 92;
    const step = cardW + 16;
    const right = 936;
    const i = Math.max(0, index);
    const desired = slot - i * step;
    const minTranslate = right - cardW - Math.max(0, count - 1) * step;
    return Math.round(Math.min(slot, Math.max(minTranslate, desired)));
  }

  function placeRow(row, index, cardW, glide) {

    row.classList.toggle('is-glide', !!glide);
    const next = 'translate3d(' + rowTranslate(index, row.children.length, cardW) + 'px,0,0)';
    if (row.dataset.tx !== next) {
      row.dataset.tx = next;
      row.style.transform = next;
    }
    clearTimeout(row.glideTimer);
    if (glide) row.glideTimer = setTimeout(() => row.classList.remove('is-glide'), 460);
  }

  function ruSeasons(n) {
    const a = n % 10;
    const b = n % 100;
    const word = a === 1 && b !== 11 ? 'сезон' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'сезона' : 'сезонов';
    return n + ' ' + word;
  }

  function yearText(item) {
    const ys = item.years;
    if (Array.isArray(ys) && ys.length) {
      return ys[0] === ys[ys.length - 1] ? String(ys[0]) : ys[0] + '–' + ys[ys.length - 1];
    }
    return item.year ? String(item.year) : '';
  }

  const SHIELDS = [
    ["новый сезон", "flash", "#00bf4c"],
    ["есть все серии", "multi", "#00bf4c"],
    ["сразу интересно", "magnet", "#a869f0"],
    ["простой сюжет", "balloon", "#a869f0"],
    ["сюжет-головоломка", "puzzle", "#a869f0"],
    ["затянет надолго", "whirl", "#ff542e"],
    ["короткие серии", "match", "#ff542e"],
    ["посмотреть за раз", "cookie", "#ff542e"],
    ["новинка", "meteor", "#00bf4c"],
    ["сейчас смотрят", "eyes", "#00a5ff"],
    ["эксклюзив", "unicorn", "#a869f0"],
    ["популярно", "bolt", "#ffb100"],
    ["оскар", "oscar", "#ffb100"],
    ["на реальных событиях", "parch", "#ffb100"],
    ["легендарный", "wreath", "#ffb100"],
    ["топ-250", "medal", "#ffb100"],
    ["выбор иви", "ivi", "#f30745"],
    ["сериал иви", "ivi", "#f30745"],
    ["лучшее в подписке", "cherry", "#f30745"]
  ];

  let shieldSeq = 0;

  function shieldIcon(kind) {
    const id = 'sh' + (shieldSeq += 1);
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    const wide = kind === 'ivi';
    svg.setAttribute('width', wide ? '12.0002' : '12');
    svg.setAttribute('height', '12');
    svg.setAttribute('viewBox', wide ? '0 0 12.0002 12' : '0 0 12 12');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = SHIELD_SVG[kind].replace(/paint(\d)_linear_0_462/g, 'p$1' + id);
    return svg;
  }

  function normShield(text) {
    return String(text || '').toLowerCase().replace(/ё/g, 'е').replace(/[\u2010-\u2015]/g, '-').replace(/\s+/g, ' ').trim();
  }

  function matchShield(name) {
    const key = normShield(name);
    if (!key) return null;
    return SHIELDS.find((row) => key === row[0] || key.startsWith(row[0])) || null;
  }

  const BADGE_COLORS = ['#00bf4c', '#a869f0', '#ff542e', '#00a5ff', '#ffb100', '#f30745'];

  function badgeColor(item, index) {
    const key = String(item.id || item.hru || item.title || index);
    let hash = 0;
    for (let i = 0; i < key.length; i += 1) hash = (hash * 33 + key.charCodeAt(i)) >>> 0;
    return BADGE_COLORS[hash % BADGE_COLORS.length];
  }

  function makeHomeCard(item, index) {
    const btn = document.createElement('button');
    btn.className = 'home-card';
    btn.type = 'button';
    btn.dataset.iviUrl = 'https://www.ivi.ru/watch/' + (item.hru || item.id);
    const poster = document.createElement('span');
    poster.className = 'home-card-poster';
    const img = document.createElement('img');
    img.alt = item.title || '';
    img.src = item.poster;
    poster.append(img);
    const text = document.createElement('span');
    text.className = 'home-card-text';
    const desc = document.createElement('span');
    desc.className = 'home-card-desc';
    desc.textContent = item.short_description || '';
    const tags = document.createElement('span');
    tags.className = 'home-card-tags';
    const rating = Number(item.ivi_rating_10);
    const shield = (item.shields || []).map((entry) => entry.short_name || entry.name || '').find((name) => matchShield(name));
    const spec = matchShield(shield);
    const showShield = Boolean(spec && index % 2 === 0);
    if (showShield) {
      const tone = document.createElement('span');
      tone.className = 'meta-tone';
      tone.style.color = badgeColor(item, index);
      const icon = document.createElement('span');
      icon.className = 'home-badge meta-icon';
      icon.append(shieldIcon(spec[1]));
      tone.append(icon);
      if (rating > 0) {
        const badge = document.createElement('span');
        badge.className = 'home-badge is-rating';
        badge.dataset.rating = String(rating);
        badge.textContent = rating.toFixed(1).replace('.', ',');
        tone.append(badge);
        const dot = document.createElement('span');
        dot.className = 'meta-dot';
        dot.setAttribute('aria-hidden', 'true');
        dot.textContent = '\u00B7';
        tone.append(dot);
      }
      const label = document.createElement('span');
      label.className = 'home-badge is-shield';
      label.textContent = shield;
      tone.append(label);
      tags.append(tone);
    } else if (rating > 0) {
      const badge = document.createElement('span');
      badge.className = 'home-badge is-rating' + (rating > 8 ? '' : ' is-low');
      badge.dataset.rating = String(rating);
      badge.textContent = rating.toFixed(1).replace('.', ',');
      tags.append(badge);
    }
    const seasons = Array.isArray(item.seasons) ? item.seasons.length : (Number(item.seasons) || 0);
    if (seasons) {
      const badge = document.createElement('span');
      badge.textContent = ruSeasons(seasons);
      tags.append(badge);
    } else if (item.duration) {
      const badge = document.createElement('span');
      badge.textContent = item.duration;
      tags.append(badge);
    }
    const year = yearText(item);
    if (year) {
      const badge = document.createElement('span');
      badge.className = 'home-year';
      badge.textContent = year;
      tags.append(badge);
    }
    text.append(desc, tags);
    btn.append(poster, text);
    return btn;
  }

  function makeContinueCard(item, index) {
    const card = document.createElement('button');
    card.className = 'home-card continue-card';
    card.type = 'button';
    card.dataset.iviUrl = 'https://www.ivi.ru/watch/' + (item.hru || item.id);
    const poster = document.createElement('span');
    poster.className = 'home-card-poster';
    const image = document.createElement('img');
    image.alt = item.title || '';
    image.src = item.poster;
    const progress = document.createElement('span');
    progress.className = 'continue-progress';
    progress.style.setProperty('--progress', item.progress + '%');
    const play = document.createElement('span');
    play.className = 'home-play';
    play.setAttribute('aria-hidden', 'true');
    poster.append(image, progress, play);
    const text = document.createElement('span');
    text.className = 'home-card-text';
    const title = document.createElement('span');
    title.className = 'home-card-name';
    title.textContent = item.title || '';
    const line = document.createElement('span');
    line.className = 'continue-line';
    const meta = document.createElement('span');
    meta.className = 'home-card-sub continue-meta';
    meta.textContent = item.update || '';
    const year = document.createElement('span');
    year.className = 'continue-year';
    year.textContent = item.year ? String(item.year) : '';
    line.append(meta, year);
    text.append(title, line);
    card.append(poster, text);
    return card;
  }

  function makeContinueGallery(items) {
    const section = document.createElement('section');
    section.className = 'home-gallery continue-gallery';
    const heading = document.createElement('h2');
    heading.className = 'home-row-title';
    heading.textContent = 'Продолжить просмотр';
    const strip = document.createElement('div');
    strip.className = 'home-row';
    items.slice(0, 4).forEach((item, index) => strip.append(makeContinueCard(item, index)));
    section.append(heading, strip);
    return section;
  }

  function loadHomeRows() {
    const group = homeGroups.mult;
    group.replaceChildren();
    if (HOME_CONTINUE.length) group.append(makeContinueGallery(HOME_CONTINUE));
    HOME_ROWS.forEach((row) => {
      const section = document.createElement('section');
      section.className = 'home-gallery';
      const heading = document.createElement('h2');
      heading.className = 'home-row-title';
      heading.textContent = row.title;
      const strip = document.createElement('div');
      strip.className = 'home-row';
      row.items.forEach((item, index) => strip.append(makeHomeCard(item, index)));
      section.append(heading, strip);
      group.append(section);
    });
    home.col.splice(2);
    if (state.screen === 'home' && home.zone >= 2) homeFocus(home.zone, 0);
    requestAnimationFrame(markYearFit);
  }

  function yearFits(line, year) {
    const prev = [line.style.boxSizing, line.style.width, line.style.minWidth, line.style.flexWrap];
    line.style.boxSizing = 'border-box';
    line.style.width = '221.62px';
    line.style.minWidth = '0';
    line.style.flexWrap = 'nowrap';
    year.style.display = 'inline';
    const fits = line.clientWidth > 0 && line.scrollWidth <= line.clientWidth + 0.5;
    year.style.display = '';
    [line.style.boxSizing, line.style.width, line.style.minWidth, line.style.flexWrap] = prev;
    return fits;
  }

  function markYearFit() {
    const stage = document.getElementById('stage');
    const had = stage.classList.contains('is-variant-4');
    const lines = [...document.querySelectorAll('.home-card-tags, .continue-line')];
    const years = lines.map((line) => line.querySelector('.home-year, .continue-year'));
    stage.classList.remove('is-variant-4');
    years.forEach((year, i) => { if (year) year.classList.toggle('is-year-fit-rated', yearFits(lines[i], year)); });
    stage.classList.add('is-variant-4');
    years.forEach((year, i) => { if (year) year.classList.toggle('is-year-fit', yearFits(lines[i], year)); });
    stage.classList.toggle('is-variant-4', had);
  }

  function homeFocus(zone, col) {
    const zones = homeZones();
    const prevZone = home.zone;
    home.zone = Math.max(0, Math.min(zones.length - 1, zone));
    const len = zones[home.zone].length;
    home.col[home.zone] = Math.max(0, Math.min(len - 1, col));
    if (home.zone === 1) setActiveTab(homeSwitchTabs[home.col[1]]);
    state.uiFocus = homeIndex();
    applyFocus();
    homeScrollTo(home.zone !== prevZone, prevZone);
  }

  function homeMove(dx, dy) {
    const zones = homeZones();
    if (dy) {
      const next = Math.max(0, Math.min(zones.length - 1, home.zone + dy));
      if (next === home.zone) return;
      let col;
      if (next === 0) col = 0;                         // постер
      else if (next === 1) col = activeTabIndex();     // табы
      else if (next >= 2) col = home.col[next] || 0;          // ряд помнит свой постер
      else col = 0;                                    // с постера/табов в первый ряд
      homeFocus(next, col);
    } else if (dx) {
      const len = zones[home.zone].length;
      const cur = home.col[home.zone] || 0;
      const col = Math.max(0, Math.min(len - 1, cur + dx));
      if (col === cur) return;
      homeFocus(home.zone, col);
    }
  }

  function showToast(text) {
    homeToast.textContent = text;
    homeToast.classList.add('is-on');
    clearTimeout(home.toastTimer);
    home.toastTimer = setTimeout(() => homeToast.classList.remove('is-on'), 1400);
  }


  function homeActivate() {
    if (home.zone === 1) return;
    showToast('Скоро');
  }

  function showHome() {
    state.screen = 'home';
    state.locked = false;
    room.token += 1;
    room.ready = false;
    room.finishing = false;
    home.zone = 0;
    home.col = [];
    home.scrollY = 0;
    setActiveTab(homeTabMult);
    homeScroll.style.transform = '';
    updateScreens();
    homeFocus(0, 0);
  }

  function enterGame() {
    if (booting) return;
    bootGame();
  }

  function items() {
    if (state.paused) return [btnExit, btnContinue];
    if (state.screen === 'home') return homeZones().flat();
    if (state.screen === 'lobby') return [btnLobby];
    if (state.screen === 'question') return [...document.querySelectorAll('#answers .answer')];
    if (state.screen === 'feedback') return [btnNext];
    if (state.screen === 'results') return [btnAgain, btnWatch];
    return [];
  }

  function focusIndex() {
    return state.paused ? state.pauseFocus : state.uiFocus;
  }

  function setFocusIndex(value) {
    if (state.paused) state.pauseFocus = value;
    else state.uiFocus = value;
  }

  function applyFocus() {
    const list = items();
    if (!list.length) {
      document.querySelectorAll('.is-focused').forEach((el) => el.classList.remove('is-focused'));
      if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
      stopMetaSpin();
      return;
    }
    let index = focusIndex();
    if (index < 0 || index >= list.length) index = 0;
    setFocusIndex(index);
    list.forEach((el, i) => el.classList.toggle('is-focused', i === index));
    const node = list[index];
    if (node && document.activeElement !== node) node.focus({ preventScroll: true });
    schedulePreview(node);
    scheduleMetaSpin(node);
  }

  let previewTimer = 0;

  function stopPreview() {
    clearTimeout(previewTimer);
    previewTimer = 0;
    const video = document.getElementById('home-preview');
    if (video) {
      video.pause();
      video.removeAttribute('src');
      video.load();
      video.remove();
    }
    document.querySelectorAll('.home-preview-shade, .home-preview-title').forEach((el) => el.remove());
  }

  function schedulePreview(node) {
    stopPreview();
    const stage = document.getElementById('stage');
    if (!stage.classList.contains('is-variant-4')) return;
    if (!node || !node.classList.contains('home-card') || node.classList.contains('continue-card')) return;
    previewTimer = setTimeout(() => {
      if (!node.classList.contains('is-focused')) return;
      if (!document.getElementById('stage').classList.contains('is-variant-4')) return;
      const poster = node.querySelector('.home-card-poster');
      if (!poster) return;
      const video = document.createElement('video');
      video.id = 'home-preview';
      video.className = 'home-preview';
      video.muted = true;
      video.defaultMuted = true;
      video.loop = true;
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.src = 'assets/preview/focus.mov';
      const shade = document.createElement('span');
      shade.className = 'home-preview-shade';
      const title = document.createElement('span');
      title.className = 'home-preview-title';
      const img = poster.querySelector('img');
      title.textContent = (img && img.alt) || '';
      poster.append(video, shade, title);
      video.play().catch(() => {});
    }, 2000);
  }

  let metaCard = null;
  let metaHold = null;
  let metaSpinEl = null;
  let metaStep = 0;
  let metaWait = 0;
  let metaAnim = 0;
  let metaDue = 0;

  const META_SHIELD = ['assets/badges/thumb-up.svg', '#00bf4c', '75% \u2022 \u0435\u0441\u0442\u044c \u0432\u0441\u0435 \u0441\u0435\u0440\u0438\u0438'];

  function metaLine(hold) {
    const line = document.createElement('span');
    line.className = 'meta-spin-line';
    line.append(...hold.cloneNode(true).childNodes);
    return line;
  }

  function shieldLine(src, color, text) {
    const line = document.createElement('span');
    line.className = 'meta-spin-line';
    const badge = document.createElement('span');
    badge.className = 'home-badge';
    badge.style.color = color;
    const icon = document.createElement('img');
    icon.alt = '';
    icon.src = src;
    icon.width = 12;
    icon.height = 12;
    badge.append(icon, document.createTextNode(text));
    line.append(badge);
    return line;
  }

  function metaFrame(step) {
    if (step === 0) return metaLine(metaHold);
    return shieldLine(META_SHIELD[0], META_SHIELD[1], META_SHIELD[2]);
  }

  function armMeta(ms) {
    clearTimeout(metaWait);
    metaDue = performance.now() + ms;
    metaWait = setTimeout(metaTick, ms);
  }

  function metaTick() {
    metaWait = 0;
    if (document.hidden) {
      metaDue = performance.now();
      return;
    }
    if (!metaSpinEl || !metaCard || !metaCard.classList.contains('is-focused')) {
      stopMetaSpin();
      return;
    }
    const current = metaSpinEl.firstElementChild;
    metaStep = (metaStep + 1) % 2;
    const next = metaFrame(metaStep);
    next.classList.add('is-in');
    if (current) current.classList.add('is-out');
    metaSpinEl.append(next);
    armMeta(3000);
    metaAnim = setTimeout(() => {
      metaAnim = 0;
      if (current && current.parentNode) current.remove();
      next.classList.remove('is-in');
    }, 280);
  }

  function stopMetaSpin() {
    clearTimeout(metaWait);
    clearTimeout(metaAnim);
    metaWait = 0;
    metaAnim = 0;
    metaDue = 0;
    metaCard = null;
    metaHold = null;
    metaSpinEl = null;
    document.querySelectorAll('.home-card-tags.is-spinning').forEach((tags) => {
      const hold = tags.querySelector('.meta-spin-hold');
      if (hold) tags.replaceChildren(...[...hold.childNodes]);
      tags.classList.remove('is-spinning');
    });
  }

  function scheduleMetaSpin(node) {
    stopMetaSpin();
    const stage = document.getElementById('stage');
    if (!stage.classList.contains('is-variant-4')) return;
    if (!node || !node.classList.contains('home-card') || node.classList.contains('continue-card')) return;
    const tags = node.querySelector('.home-card-tags');
    if (!tags) return;
    const hold = document.createElement('span');
    hold.className = 'meta-spin-hold';
    hold.append(...tags.childNodes);
    const sr = document.createElement('span');
    sr.className = 'meta-spin-sr';
    const plain = [...hold.children]
      .filter((el) => !el.classList.contains('is-rating'))
      .map((el) => el.textContent.trim())
      .filter(Boolean);
    sr.textContent = plain.concat(META_SHIELD[2]).join(', ');
    const spin = document.createElement('span');
    spin.className = 'meta-spin';
    spin.setAttribute('aria-hidden', 'true');
    metaHold = hold;
    metaSpinEl = spin;
    metaCard = node;
    metaStep = 0;
    spin.append(metaFrame(0));
    tags.classList.add('is-spinning');
    tags.append(sr, spin, hold);
    armMeta(1000);
  }

  document.addEventListener('visibilitychange', () => {
    if (!metaCard || metaAnim) return;
    if (document.hidden) {
      clearTimeout(metaWait);
      metaWait = 0;
      return;
    }
    if (metaDue) armMeta(Math.max(0, metaDue - performance.now()));
  });

  function updateScreens() {
    card.dataset.mode = state.screen;
    stage.dataset.screen = state.screen;
    document.querySelectorAll('.screen').forEach((el) => {
      el.classList.toggle('active', el.dataset.screen === state.screen);
    });
  }

  function renderPips() {
    const row = document.getElementById('pips');
    if (row.childElementCount !== quizData.length) {
      row.replaceChildren();
      for (let i = 0; i < quizData.length; i += 1) {
        row.appendChild(document.createElement('span'));
      }
    }
    const answered = state.screen === 'feedback';
    [...row.children].forEach((dot, i) => {
      const done = i < state.q || (answered && i === state.q);
      const now = !done && i === state.q;
      dot.className = 'pip' + (done ? ' is-done' : now ? ' is-now' : '');
    });
  }

  function updateHud() {
    document.getElementById('hud-label').textContent = 'Вопрос ' + (state.q + 1) + ' из ' + quizData.length;
    document.getElementById('hud-score').textContent = 'Экипаж: ' + room.players.length;
    renderPips();
  }

  const API_BASE = /^https?:$/.test(location.protocol) ? '' : 'http://127.0.0.1:8765/';
  const qrImg = document.getElementById('qr-img');
  let qrRetry = 0;

  function loadQr() {
    qrImg.src = API_BASE + 'api/qr.svg?t=' + Date.now();
  }

  qrImg.addEventListener('load', () => { qrRetry = 0; });
  qrImg.addEventListener('error', () => {
    clearTimeout(qrRetry);
    qrRetry = setTimeout(loadQr, 1500);
  });

  async function api(path, body) {
    const options = { cache: 'no-store' };
    if (body !== undefined) {
      options.method = 'POST';
      options.headers = { 'Content-Type': 'application/json' };
      options.body = JSON.stringify(body);
    }
    const res = await fetch(API_BASE + path, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(data.error || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  const crewList = document.getElementById('crew-list');
  const crewEmpty = document.getElementById('crew-empty');
  const crewHead = document.getElementById('crew-head');
  const crewChips = document.getElementById('crew-chips');
  const qTimer = document.getElementById('q-timer');

  function renderLobby() {
    const key = room.players.map((p) => p.id + ':' + p.name).join('|');
    if (key !== room.lastNames) {
      room.lastNames = key;
      crewList.replaceChildren(...room.players.map((p) => {
        const el = document.createElement('span');
        el.className = 'crew-name';
        el.textContent = p.name;
        return el;
      }));
    }
    const count = room.players.length;
    crewEmpty.hidden = count > 0;
    crewEmpty.textContent = room.online ? 'Пока никого нет' : 'Нет связи с сервером игры';
    crewHead.textContent = count ? 'Экипаж · ' + count : 'Экипаж';
    btnLobby.classList.toggle('is-waiting', count === 0);
    btnLobby.textContent = Date.now() < room.flashUntil
      ? 'Сначала подключите хотя бы одного игрока'
      : 'Нажмите OK, когда все собрались';
  }

  function renderCrew(players) {
    if (!players.length) {
      const el = document.createElement('span');
      el.className = 'crew-chip';
      el.textContent = 'Ждём игроков';
      crewChips.replaceChildren(el);
      return;
    }
    crewChips.replaceChildren(...players.map((p) => {
      const el = document.createElement('span');
      el.className = 'crew-chip' + (p.answered ? ' is-done' : '');
      el.textContent = p.answered ? p.name + ' ✓' : p.name + ' …';
      return el;
    }));
  }

  function applyRoom(data) {
    room.online = true;
    room.players = Array.isArray(data.players) ? data.players : [];
    renderLobby();
    if (state.screen === 'question' || state.screen === 'feedback') {
      document.getElementById('hud-score').textContent = 'Экипаж: ' + room.players.length;
    }
    if (state.screen === 'question' && !state.locked && room.ready && data.phase === 'question' && data.q === state.q) {
      renderCrew(room.players);
    }
  }

  let pollBusy = false;

  async function poll() {
    if (pollBusy) return;
    pollBusy = true;
    const token = room.token;
    try {
      const data = await api('api/state');
      applyRoom(data);
      const live = state.screen === 'question' && !state.locked && !state.paused
        && token === room.token && room.ready && data.phase === 'question' && data.q === state.q;
      if (live && room.players.length > 0 && room.players.every((p) => p.answered)) reveal();
    } catch (err) {
      room.online = false;
      renderLobby();
    } finally {
      pollBusy = false;
    }
  }

  function tick() {
    if (state.paused) return;
    const now = Date.now();
    if (state.screen === 'question' && !state.locked) {
      const left = Math.max(0, Math.ceil((room.deadline - now) / 1000));
      if (qTimer.textContent !== String(left)) qTimer.textContent = String(left);
      if (room.ready && left <= 0) reveal();
    } else if (state.screen === 'lobby' && room.flashUntil && now >= room.flashUntil) {
      room.flashUntil = 0;
      renderLobby();
    }
  }

  function flashLobbyHint() {
    room.flashUntil = Date.now() + 2500;
    renderLobby();
    playWrong();
  }

  function showLobby(resetRoom) {
    state.screen = 'lobby';
    state.q = 0;
    state.locked = false;
    state.uiFocus = 0;
    room.token += 1;
    room.ready = false;
    room.finishing = false;
    renderLobby();
    updateScreens();
    applyFocus();
    loadQr();
    if (resetRoom) api('api/lobby', {}).then(applyRoom).catch(() => {});
  }

  function showQuestion() {
    const q = quizData[state.q];
    state.screen = 'question';
    state.locked = false;
    state.uiFocus = 0;
    room.token += 1;
    room.ready = false;
    const token = room.token;
    room.deadline = Date.now() + QUESTION_SECONDS * 1000;
    document.getElementById('q-text').textContent = q.question;
    const box = document.getElementById('answers');
    box.replaceChildren();
    q.answers.forEach((text, idx) => box.appendChild(makeAnswerCard(text, idx, q.question)));
    requestAnimationFrame(() => fitLabels(box));
    qTimer.textContent = String(QUESTION_SECONDS);
    renderCrew(room.players.map((p) => ({ name: p.name, answered: false })));
    updateHud();
    updateScreens();
    applyFocus();
    const done = () => {
      if (token !== room.token) return;
      room.deadline = Date.now() + QUESTION_SECONDS * 1000;
      room.ready = true;
      poll();
    };
    api('api/question', {
      q: state.q,
      total: quizData.length,
      text: q.question,
      answers: q.answers,
      correct: q.correct,
      seconds: QUESTION_SECONDS
    }).then(done, done);
  }

  async function reveal() {
    if (state.screen !== 'question' || state.locked) return;
    state.locked = true;
    const token = room.token;
    let players = room.players;
    try {
      const data = await api('api/reveal', {});
      applyRoom(data);
      players = room.players;
    } catch (err) {
      players = room.players;
    }
    if (token !== room.token || state.screen !== 'question') return;
    showFeedback(quizData[state.q], players);
  }

  function showFeedback(q, players) {
    state.screen = 'feedback';
    state.uiFocus = 0;
    const winners = players.filter((p) => p.choice === q.correct).map((p) => p.name);
    const ok = winners.length > 0;
    document.getElementById('fb-q').textContent = q.question;
    const title = document.getElementById('fb-title');
    title.textContent = ok ? GOOD[state.q % GOOD.length] : SOFT[state.q % SOFT.length];
    title.classList.toggle('is-good', ok);
    title.classList.toggle('is-soft', !ok);
    const all = ok && winners.length === players.length && players.length > 1;
    document.getElementById('fb-sub').textContent = all
      ? 'Все ответили верно — звезда каждому!'
      : ok ? 'Ответ правильный: ' + winners.join(', ') : 'Никто не угадал — так мы узнаём новое.';
    const picks = {};
    players.forEach((p) => {
      if (p.choice === null || p.choice === undefined) return;
      if (!picks[p.choice]) picks[p.choice] = [];
      picks[p.choice].push(p.name);
    });
    const board = document.getElementById('fb-answers');
    board.replaceChildren();
    q.answers.forEach((text, idx) => {
      const tile = makeAnswerCard(text, idx, q.question);
      if (idx === q.correct) tile.classList.add('is-right');
      else if (picks[idx]) tile.classList.add('is-picked');
      board.appendChild(tile);
    });
    requestAnimationFrame(() => fitLabels(board));
    document.getElementById('fb-fact').textContent = q.fact;
    btnNext.dataset.base = state.q + 1 >= quizData.length ? 'К результатам' : 'Дальше';
    btnNext.textContent = btnNext.dataset.base;
    updateHud();
    updateScreens();
    applyFocus();
    if (ok) {
      playCorrect();
      celebrate('good');
    } else {
      playWrong();
      celebrate('soft');
    }
  }

  function nextStep() {
    if (state.paused || state.screen !== 'feedback') return;
    if (state.q + 1 >= quizData.length) finishGame();
    else {
      state.q += 1;
      showQuestion();
    }
  }

  async function finishGame() {
    if (room.finishing) return;
    room.finishing = true;
    let players = room.players;
    try {
      const data = await api('api/finish', {});
      applyRoom(data);
      players = room.players;
    } catch (err) {
      players = room.players;
    }
    showResults(players);
  }

  function resultMessage(score) {
    const lines = [
      ['Разведка удалась!', 'Сегодня был пробный полёт. Давайте ещё раз — вместе обязательно зажжём звёзды.'],
      ['Первая звезда!', 'Один верный ответ уже светится. Космос любит любопытных.'],
      ['Хороший старт!', 'Две звезды на борту. Ещё один виток — и их станет больше.'],
      ['Герои космоса!', 'Три из трёх! Вы знаете Солнечную систему как родной дом.']
    ];
    const i = Math.max(0, Math.min(score, lines.length - 1));
    return { title: lines[i][0], text: lines[i][1] };
  }

  function makeStar(on, index) {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 64 64');
    svg.setAttribute('class', 'award' + (on ? ' is-on' : ''));
    svg.setAttribute('aria-hidden', 'true');
    if (on) svg.style.animationDelay = (index * 0.1) + 's';
    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', 'M32 4.5 39.5 22.2 58.6 23.8 43.8 36.2 48.4 54.8 32 44.8 15.6 54.8 20.2 36.2 5.4 23.8 24.5 22.2 Z');
    svg.appendChild(path);
    return svg;
  }

  function showResults(players) {
    state.screen = 'results';
    state.locked = false;
    state.uiFocus = 0;
    room.finishing = false;
    const total = quizData.length;
    const list = players.slice().sort((a, b) => b.score - a.score);
    const sum = list.reduce((acc, p) => acc + p.score, 0);
    const score = list.length ? Math.round(sum / list.length) : 0;
    const best = list.length ? list[0].score : 0;
    const board = document.getElementById('res-board');
    if (!list.length) {
      const empty = document.createElement('p');
      empty.className = 'res-empty';
      empty.textContent = 'Нет игроков';
      board.replaceChildren(empty);
    } else {
      board.replaceChildren(...list.map((p) => {
        const el = document.createElement('div');
        el.className = 'res-player' + (best > 0 && p.score === best ? ' is-top' : '');
        const nm = document.createElement('span');
        nm.className = 'res-player-name';
        nm.textContent = p.name;
        const sc = document.createElement('b');
        sc.textContent = p.score + ' из ' + total;
        el.append(nm, sc);
        return el;
      }));
    }
    updateScreens();
    applyFocus();
    celebrate(score >= total ? 'win' : score >= 3 ? 'good' : 'soft');
    playFinish(score, total);
  }

  async function startGame() {
    if (state.paused || room.starting) return;
    if (!room.players.length) {
      if (state.screen !== 'lobby') showLobby(true);
      flashLobbyHint();
      return;
    }
    room.starting = true;
    try {
      await api('api/start', { total: quizData.length });
    } catch (err) {
      room.starting = false;
      if (state.screen !== 'lobby') showLobby(true);
      flashLobbyHint();
      return;
    }
    room.starting = false;
    state.q = 0;
    state.locked = false;
    playStart();
    showQuestion();
  }

  function previewQuestion() {
    const first = quizData.findIndex((q) => q.answers.some((text) => answerArt(text)));
    room.starting = false;
    api('api/start', { total: quizData.length }).catch(() => {});
    state.q = Math.max(0, first);
    state.locked = false;
    showQuestion();
  }

  let pausedAt = 0;

  function openPause() {
    if (state.paused) return;
    state.paused = true;
    state.pauseFocus = 1;
    pausedAt = Date.now();
    pauseEl.hidden = false;
    stage.classList.add('is-paused');
    applyFocus();
  }

  function closePause() {
    if (!state.paused) return;
    const shift = Date.now() - pausedAt;
    room.deadline += shift;
    room.feedbackAt += shift;
    state.paused = false;
    pauseEl.hidden = true;
    stage.classList.remove('is-paused');
    applyFocus();
  }

  function quitToStart() {
    state.paused = false;
    pauseEl.hidden = true;
    stage.classList.remove('is-paused');
    showHome();
    api('api/lobby', {}).then(applyRoom).catch(() => {});
  }

  function toggleSound() {
    state.sound = !state.sound;
    if (soundBtn) {
      soundBtn.classList.toggle('is-muted', !state.sound);
      soundBtn.setAttribute('aria-pressed', state.sound ? 'true' : 'false');
      soundBtn.setAttribute('aria-label', state.sound ? 'Выключить звук' : 'Включить звук');
    }
    if (state.sound) playStart();
  }

  function celebrate(kind) {
    const layer = document.getElementById('fx');
    layer.replaceChildren();
    const count = kind === 'win' ? 26 : kind === 'good' ? 16 : 8;
    const colors = kind === 'soft'
      ? ['#9ecbff', '#ffe9a8', '#d7e2ff']
      : ['#ffd56a', '#7ddeb8', '#8ecbff', '#ffb4a8', '#fff4d2'];
    for (let i = 0; i < count; i += 1) {
      const el = document.createElement('span');
      el.className = 'spark';
      const angle = Math.random() * Math.PI * 2;
      const dist = (kind === 'soft' ? 36 : 70) + Math.random() * (kind === 'win' ? 230 : 150);
      el.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
      el.style.setProperty('--dy', (Math.sin(angle) * dist - 20) + 'px');
      el.style.setProperty('--rot', (Math.random() * 200 - 100) + 'deg');
      const size = (kind === 'soft' ? 7 : 8) + Math.random() * 7;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.borderRadius = Math.random() > 0.45 ? '50%' : '2px';
      el.style.background = colors[i % colors.length];
      el.style.left = (30 + Math.random() * 40) + '%';
      el.style.top = kind === 'win' ? '46%' : '40%';
      el.style.animationDuration = (kind === 'soft' ? 1100 : 900) + 'ms';
      layer.appendChild(el);
    }
  }

  function answerArt(text, question) {
    const set = QUESTION_ART[question];
    if (set) {
      const item = quizData.find((q) => q.question === question);
      const i = item ? item.answers.indexOf(text) : -1;
      if (i >= 0 && set[i]) return set[i];
    }
    return ANSWER_ART[String(text).trim().toLowerCase()] || '';
  }

  function makeAnswerCard(text, idx, question) {
    const tile = document.createElement('div');
    tile.className = 'answer is-static';
    tile.tabIndex = -1;
    const art = document.createElement('div');
    art.className = 'art';
    const src = answerArt(text, question);
    if (src) {
      const img = document.createElement('img');
      img.className = 'art-img';
      img.src = src;
      img.alt = '';
      art.appendChild(img);
    } else {
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = String(idx + 1);
      art.appendChild(num);
    }
    const caption = document.createElement('div');
    caption.className = 'caption';
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = text;
    caption.appendChild(label);
    tile.append(art, caption);
    return tile;
  }

  function fitLabels(root) {
    root.querySelectorAll('.label').forEach((label) => {
      const box = label.parentElement;
      let size = 28;
      label.style.fontSize = size + 'px';
      while (size > 20 && (label.scrollHeight > box.clientHeight + 1 || label.scrollWidth > label.clientWidth + 1)) {
        size -= 2;
        label.style.fontSize = size + 'px';
      }
    });
  }

  function moveFocus(dx, dy) {
    if (!state.paused && state.screen === 'home') {
      homeMove(dx, dy);
      return;
    }
    const list = items();
    if (list.length <= 1) return;
    const dir = dx !== 0 ? dx : dy;
    if (!dir) return;
    const index = (focusIndex() + dir + list.length) % list.length;
    setFocusIndex(index);
    applyFocus();
  }

  function activate() {
    if (state.paused) {
      const action = [quitToStart, closePause][state.pauseFocus];
      if (action) action();
      return;
    }
    if (state.screen === 'home') homeActivate();
    else if (state.screen === 'lobby') startGame();
    else if (state.screen === 'feedback') nextStep();
    else if (state.screen === 'results') {
      const el = items()[focusIndex()];
      if (el) el.click();
    }
  }

  function isOk(e) {
    return e.key === 'Enter' || e.key === ' ' || e.key === 'Select' || e.keyCode === 13 || e.keyCode === 32 || e.keyCode === 23;
  }

  function isBack(e) {
    return e.key === 'Escape' || e.key === 'Backspace' || e.key === 'BrowserBack' || e.key === 'GoBack'
      || e.keyCode === 8 || e.keyCode === 27 || e.keyCode === 461 || e.keyCode === 10009;
  }

  function arrowOf(e) {
    if (e.key === 'ArrowLeft' || e.keyCode === 37) return [-1, 0];
    if (e.key === 'ArrowRight' || e.keyCode === 39) return [1, 0];
    if (e.key === 'ArrowUp' || e.keyCode === 38) return [0, -1];
    if (e.key === 'ArrowDown' || e.keyCode === 40) return [0, 1];
    return null;
  }

  const modeBar = document.getElementById('mode-bar');
  const modeTabs = [...modeBar.querySelectorAll('.mode-tab')];
  let modeOpen = false;
  let modeIndex = 0;

  function setMode(index) {
    const next = Math.max(0, Math.min(modeTabs.length - 1, index));
    const changed = next !== modeIndex;
    modeIndex = next;
    modeTabs.forEach((tab, i) => tab.classList.toggle('is-active', i === modeIndex));
    const stage = document.getElementById('stage');
    stage.classList.toggle('is-variant-2', modeIndex === 1 || modeIndex === 3);
    stage.classList.toggle('is-variant-3', modeIndex === 2);
    stage.classList.toggle('is-variant-4', modeIndex === 3);
    if (stage.classList.contains('is-variant-4')) {
      const focused = document.querySelector('.home-card.is-focused');
      schedulePreview(focused);
      if (!metaCard) scheduleMetaSpin(focused);
    } else {
      stopPreview();
      stopMetaSpin();
    }
    if (!changed || state.screen !== 'home') return;
    stage.classList.add('is-variant-snap');
    homeScrollTo(false, home.zone);
    void stage.offsetWidth;
    requestAnimationFrame(() => stage.classList.remove('is-variant-snap'));
  }

  function openMode() {
    modeOpen = true;
    document.getElementById('stage').classList.add('is-mode');
    setMode(modeIndex);
  }

  function closeMode() {
    modeOpen = false;
    document.getElementById('stage').classList.remove('is-mode');
  }

  modeTabs.forEach((tab, i) => tab.addEventListener('click', () => setMode(i)));

  let pullUp = 0;
  document.getElementById('stage').addEventListener('wheel', (e) => {
    if (booting || state.screen !== 'home' || state.paused) return;
    if (modeOpen) {
      if (e.deltaY > 24) closeMode();
      e.preventDefault();
      return;
    }
    const atTop = home.zone === 0 && !(home.scrollY > 0);
    if (!atTop || e.deltaY >= 0) { pullUp = 0; return; }
    pullUp += -e.deltaY;
    if (pullUp < 90) return;
    pullUp = 0;
    openMode();
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (booting) {
      e.preventDefault();
      return;
    }
    if (e.repeat) return;
    const arrow = arrowOf(e);
    if (modeOpen) {
      e.preventDefault();
      if (arrow) {
        if (arrow[0]) setMode(modeIndex + arrow[0]);
        else if (arrow[1] > 0) closeMode();
      } else if (isOk(e)) setMode(modeIndex);
      return;
    }
    if (arrow && arrow[1] < 0 && state.screen === 'home' && !state.paused && home.zone === 0) {
      e.preventDefault();
      openMode();
      return;
    }
    if (arrow) {
      e.preventDefault();
      moveFocus(arrow[0], arrow[1]);
      return;
    }
    if (isBack(e)) {
      e.preventDefault();
      if (!state.paused && state.screen === 'home') return;
      if (state.paused) closePause();
      else openPause();
      return;
    }
    if (e.code === 'KeyM') {
      e.preventDefault();
      toggleSound();
      return;
    }
    if (isOk(e)) {
      e.preventDefault();
      activate();
    }
  });

  homePoster.addEventListener('click', () => {
    homeFocus(0, 0);
    showToast('Скоро');
  });
  homeTabs.forEach((tab) => {
    const idx = homeSwitchTabs.indexOf(tab);
    tab.addEventListener('mousedown', (e) => {
      if (idx < 0) e.preventDefault();
    });
    tab.addEventListener('click', () => {
      if (idx < 0) return;
      homeFocus(1, idx);
    });
  });
  homeContent.addEventListener('click', (e) => {
    const card = e.target.closest('.home-card');
    if (!card) return;
    const rows = currentRows();
    for (let r = 0; r < rows.length; r += 1) {
      const c = rows[r].indexOf(card);
      if (c >= 0) { homeFocus(r + 2, c); break; }
    }
    showToast('Скоро');
  });
  btnLobby.addEventListener('click', startGame);
  btnNext.addEventListener('click', nextStep);
  btnAgain.addEventListener('click', startGame);
  const watchEpisode = () => { window.open(EPISODE_URL, '_blank', 'noopener'); };
  btnWatch.addEventListener('click', watchEpisode);
  resPoster.addEventListener('click', watchEpisode);
  btnContinue.addEventListener('click', closePause);
  btnExit.addEventListener('click', quitToStart);

  document.getElementById('stage').addEventListener('focusin', (e) => {
    const list = items();
    const index = list.indexOf(e.target);
    if (index < 0) return;
    setFocusIndex(index);
    list.forEach((el, i) => el.classList.toggle('is-focused', i === index));
  });

  function fitStage() {
    const scale = Math.min(window.innerWidth / 960, window.innerHeight / 540);
    document.getElementById('stage').style.transform = 'scale(' + scale + ')';
  }

  window.addEventListener('resize', fitStage);
  fitStage();
  applyCardRatings();
  showHome();
  loadHomeRows();
  poll();
  setInterval(poll, 1000);
  setInterval(tick, 250);

  function bootGame() {
    const boot = document.getElementById('boot');
    const cover = document.getElementById('boot-cover');
    const fill = document.getElementById('boot-fill');
    const runner = document.getElementById('boot-runner');
    const track = document.getElementById('boot-track');
    const MIN_MS = 2600;
    const MAX_MS = 6000;
    const run = ++bootRun;
    booting = true;
    boot.hidden = false;
    boot.classList.remove('is-done');
    boot.removeAttribute('aria-hidden');
    boot.setAttribute('aria-busy', 'true');
    const started = performance.now();
    let coverDone = false;
    let mashaDone = false;
    let shown = 0;
    let trackWidth = track.clientWidth || 816;
    let closed = false;

    function markCover() {
      coverDone = true;
      if (cover.naturalWidth > 0) cover.classList.add('is-ready');
    }

    if (cover.complete) markCover();
    else {
      cover.addEventListener('load', markCover, { once: true });
      cover.addEventListener('error', () => { coverDone = true; }, { once: true });
    }

    const masha = new Image();
    const markMasha = () => { mashaDone = true; };
    masha.onload = markMasha;
    masha.onerror = markMasha;
    masha.src = 'assets/Маша.png?v=20260930';
    if (masha.complete) markMasha();
    setTimeout(markMasha, 4000);

    function measure() {
      trackWidth = track.clientWidth || trackWidth;
    }

    function paint(p) {
      const clamped = p < 0 ? 0 : p > 1 ? 1 : p;
      fill.style.transform = 'scaleX(' + clamped.toFixed(4) + ')';
      const runnerW = runner.offsetWidth || 128;
      const travel = Math.max(0, trackWidth - runnerW);
      runner.style.transform = 'translate3d(' + (clamped * travel).toFixed(1) + 'px,0,0)';
    }

    function finish() {
      if (closed) return;
      closed = true;
      paint(1);
      showLobby(true);
      boot.classList.add('is-done');
      const hide = () => {
        if (run !== bootRun || !booting) return;
        booting = false;
        boot.hidden = true;
        boot.setAttribute('aria-hidden', 'true');
        boot.setAttribute('aria-busy', 'false');
        applyFocus();
      };
      const fadeMs = Math.round((parseFloat(getComputedStyle(boot).transitionDuration) || 0) * 1000);
      if (fadeMs === 0) hide();
      else {
        boot.addEventListener('transitionend', (e) => {
          if (e.target === boot && e.propertyName === 'opacity') hide();
        });
        setTimeout(hide, fadeMs + 80);
      }
    }

    function frame(now) {
      if (closed) return;
      const elapsed = now - started;
      const resourcesDone = coverDone && mashaDone;
      const canFinish = (resourcesDone && elapsed >= MIN_MS) || elapsed >= MAX_MS;
      let goal;
      if (canFinish) goal = 1;
      else {
        const timeEase = 1 - Math.exp(-elapsed / 900);
        goal = 0.06 + timeEase * 0.5;
        if (coverDone) goal += 0.22;
        if (mashaDone) goal += 0.14;
        if (goal > 0.92) goal = 0.92;
      }
      shown += (goal - shown) * (canFinish ? 0.18 : 0.1);
      if (shown > goal) shown = goal;
      if (canFinish && shown > 0.985) shown = 1;
      paint(shown);
      if (shown >= 1) {
        finish();
        return;
      }
      requestAnimationFrame(frame);
    }

    measure();
    paint(0);
    window.addEventListener('resize', measure);
    requestAnimationFrame(frame);
  }

  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const stars = [];
  for (let i = 0; i < 72; i += 1) {
    const near = Math.random();
    stars.push({
      x: Math.random() * 960,
      y: Math.random() * 540,
      speed: near > 0.82 ? 0.045 : near > 0.5 ? 0.02 : 0.008,
      size: near > 0.9 ? 2.2 : near > 0.7 ? 1.6 : 1.1,
      alpha: 0.35 + Math.random() * 0.65,
      phase: Math.random() * Math.PI * 2,
      tw: 0.6 + Math.random() * 1.4,
      color: near > 0.88 ? '#ffe7a8' : near > 0.72 ? '#cfe4ff' : '#ffffff'
    });
  }

  let comet = null;
  let skyTimer = 0;
  let lastTick = 0;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function drawSky(time, moving) {
    ctx.clearRect(0, 0, 960, 540);
    for (let i = 0; i < stars.length; i += 1) {
      const star = stars[i];
      if (moving) {
        star.x -= star.speed * time;
        if (star.x < -2) star.x += 962;
      }
      const twinkle = moving ? 0.55 + 0.45 * Math.sin(skyTimer * 0.002 * star.tw + star.phase) : 0.85;
      ctx.globalAlpha = star.alpha * twinkle;
      ctx.fillStyle = star.color;
      ctx.fillRect(star.x, star.y, star.size, star.size);
    }
    if (moving) {
      if (!comet && Math.random() < 0.004) {
        comet = { x: 980, y: 16 + Math.random() * 140, life: 1 };
      }
      if (comet) {
        comet.x -= 7;
        comet.y += 2.1;
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = '#fff6d4';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(comet.x, comet.y);
        ctx.lineTo(comet.x + 42, comet.y - 12);
        ctx.stroke();
        if (comet.x < -50) comet = null;
      }
    }
    ctx.globalAlpha = 1;
  }

  function skyFrame(now) {
    const dt = Math.min(34, now - lastTick || 16);
    lastTick = now;
    skyTimer = now;
    if (!document.hidden && skyLive) drawSky(dt, true);
    requestAnimationFrame(skyFrame);
  }

  if (reduceMotion) drawSky(0, false);
  else requestAnimationFrame(skyFrame);
</script>
</body>
